name: Build ThorPDV Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-pdv/**'
      - '.github/workflows/pdv-desktop.yml'

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-pdv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-pdv/package.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThorPDV-Desktop-Windows
          path: desktop-pdv/dist/*.exe
          if-no-files-found: error
          retention-days: 14
